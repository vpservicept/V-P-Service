<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>V&P Service – Súčiastky</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    color: #ccc;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 0 15px;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 20px;
}

.product {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.product h2 {
    margin-bottom: 8px;
    font-size: 20px;
}

.product p {
    color: #555;
    margin-bottom: 12px;
}

.product button {
    background: #16a34a;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.product button:hover {
    background: #15803d;
}

.order {
    display: none;
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-top: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.order h2 {
    margin-bottom: 15px;
}

.order input,
.order textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.order button {
    width: 100%;
    background: #111827;
    color: white;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>V&P Service</h1>
    <p>Súčiastky na mobilné telefóny</p>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Hľadať telefón alebo súčiastku..."
        onkeyup="searchProducts()"
    >

    <div id="products">

        <div class="product">
            <h2>Samsung Galaxy A12</h2>
            <p>Matičná doska</p>
            <button onclick="order('Samsung Galaxy A12 - Matičná doska')">
                Objednať
            </button>
        </div>

            <h2>Samsung Galaxy A13</h2>
            <p>Matičná doska</p>
            <button onclick="order('Samsung Galaxy A13 - Matičná doska')">
                Objednať
            </button>
        </div>
